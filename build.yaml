overview: "Recherche tolérante (accents, fautes), filtres combinables et recherches enregistrées en tuiles, sur le web et la TV"
description: >
  JellySearch remplace la recherche de Jellyfin pour les films, séries, épisodes et collections :
  elle ignore les accents et les fautes de frappe, cherche aussi dans les résumés, les acteurs, les
  réalisateurs, les genres et les tags, et comprend des filtres (note IMDb ou TMDB, année, durée,
  genre, MediaID, vu, favori…) avec ET, OU, NON, >, <, =. Sur la TV, on tape les filtres ou on les
  dicte en phrases ; les recherches enregistrées deviennent des tuiles dans « Mes médias ».
